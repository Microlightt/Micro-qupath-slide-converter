<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc"><title id="title">Micro QuPath Slide Converter</title><desc id="desc">把病理切片转成 QuPath 能读取的格式。明场切片输出 SVS，独立通道输出 OME-TIFF。右侧为病理切片转换概念插画。</desc><rect width="1600" height="700" rx="26" fill="#F7F7EF"/><g id="title-block"><text x="72" y="178" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="96" font-weight="750" fill="#252B25">Micro QuPath</text><text x="74" y="265" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="82" font-weight="700" fill="#252B25">Slide Converter</text><text x="76" y="363" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="44" font-weight="650" fill="#252B25">把病理切片转成</text><text x="76" y="424" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="44" font-weight="650" fill="#252B25">QuPath 能读取的格式</text><path d="M76 466H650" stroke="#CDD5C6" stroke-width="2"/><text x="76" y="533" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="32" font-weight="500" fill="#252B25">明场切片</text><path d="M273 519h55m-11 -9l11 9 -11 9" fill="none" stroke="#446D52" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="535" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="43" font-weight="650" fill="#355F49">SVS</text><text x="76" y="613" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="32" font-weight="500" fill="#252B25">独立通道</text><path d="M273 599h55m-11 -9l11 9 -11 9" fill="none" stroke="#446D52" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="370" y="615" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="38" font-weight="650" fill="#355F49">OME-TIFF</text></g><g id="pathology-conversion-scene"><svg x="770" y="35" width="800" height="640" viewBox="0 0 1402 1122"><image href="hero-scene.png" width="1402" height="1122"/><text x="735" y="158" transform="rotate(4.2 735 158)" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" fill="#2F4938">QuPath</text></svg></g></svg>