<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1250" viewBox="0 0 800 1250" role="img" aria-labelledby="title desc"><title id="title">Micro QuPath Slide Converter</title><desc id="desc">把病理切片转成 QuPath 能读取的格式。明场切片输出 SVS，独立通道输出 OME-TIFF。右侧为病理切片转换概念插画。</desc><rect width="800" height="1250" rx="26" fill="#F7F7EF"/><g id="title-block"><text x="52" y="130" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="87" font-weight="750" fill="#252B25">Micro QuPath</text><text x="52" y="228" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="80" font-weight="700" fill="#252B25">Slide Converter</text><text x="55" y="320" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="43" font-weight="650" fill="#252B25">把病理切片转成</text><text x="55" y="382" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="43" font-weight="650" fill="#252B25">QuPath 能读取的格式</text><path d="M55 420H745" stroke="#CDD5C6" stroke-width="2"/><text x="55" y="481" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="32" font-weight="500" fill="#252B25">明场切片</text><path d="M247 468h55m-11 -9l11 9 -11 9" fill="none" stroke="#446D52" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="484" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="42" font-weight="650" fill="#355F49">SVS</text><text x="55" y="554" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="32" font-weight="500" fill="#252B25">独立通道</text><path d="M247 541h55m-11 -9l11 9 -11 9" fill="none" stroke="#446D52" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="557" font-family="Arial,Helvetica,PingFang SC,sans-serif" font-size="38" font-weight="650" fill="#355F49">OME-TIFF</text></g><g id="pathology-conversion-scene"><svg x="36" y="614" width="728" height="583" viewBox="0 0 1402 1122"><image href="hero-scene.png" width="1402" height="1122"/><text x="735" y="158" transform="rotate(4.2 735 158)" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" fill="#2F4938">QuPath</text></svg></g></svg>